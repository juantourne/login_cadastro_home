services:
  mysql:
    image: mysql:8.4
    container_name: login_cadastro_mysql

    environment:
      MYSQL_DATABASE: projeto_login
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: