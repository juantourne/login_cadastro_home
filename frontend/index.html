<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=language"/>
</head>
<body>
    <header>

        <span id="btn-language" class="material-symbols-outlined">language</span>

    </header>

    <main>

        <div class="login">

            <h1 data-i18n="tituloLogin">Login</h1>

            <!-- Formulário de Login -->
            <form id="login-form" action="home.html">

                <!-- Entrada de usuário ou email -->
                <label for="username" data-i18n="labelLoginUsuario">Usuário ou endereço de email</label>
                <p class="validacao" id="validacao-user"></p>
                <input type="text" id="username" data-i18n-placeholder="placeholderLoginUsuario" placeholder="Digite seu usuário ou email">

                <!-- Entrada de senha -->
                <div class="opcoes">
                    <label for="password" data-i18n="labelLoginSenha">Senha</label>
                    <a href="#" data-i18n="opcaoEsqueceuSenha">Esqueceu sua senha?</a>
                </div>
                <p class="validacao" id="validacao-password"></p>
                <input type="password" id="current-password" data-i18n-placeholder="placeholderLoginSenha" placeholder="Digite sua senha">

                <!-- Botão de login -->
                <button id="btn-login" data-i18n="botaoEntrar">Entrar</button>

            </form>

            <!-- Caso usuário não tenha login -->
            <div class="cadastro_form">
                <p data-i18n="perguntaCadastro">Novo no sistema?</p>
                <a href="cadastro.html" class="tela_cadastro" data-i18n="opcaoCadastro">Faça o cadastro.</a>
            </div>
        </div>
    </main>

    <!-- Modal de linguagens -->
    <div id="modal-language" class="modal">

        <div class="modal-content">

            <!-- Botão para fechar modal -->
            <button id="fechar-language" class="fechar-modal">✕</button>

            <h2 data-i18n="tituloMenuLinguagem">Selecione seu país/região</h2>

            <div id="paises">

                <div>
                    <h3 data-i18n="tituloAmericas">Américas</h3>
                    <a href="#" data-pais="US">United States</a>
                    <a href="#" data-pais="CA">Canada - Français</a>
                    <a href="#" data-pais="CA">Canada - English</a>
                    <a href="#" data-pais="BR">Brasil</a>
                    <a href="#" data-pais="MX">México</a>
                </div>

                <div>
                    <h3 data-i18n="tituloAsia">Ásia</h3>
                    <a href="#" data-pais="AU">Australia</a>
                    <a href="#" data-pais="CN">中国-简体中文</a>
                    <a href="#" data-pais="IN">India</a>
                    <a href="#" data-pais="JP">日本</a>
                    <a href="#" data-pais="KR">대한민국</a>
                    <a href="#" data-pais="SG">Singapore</a>
                </div>

                <div>
                    <h3 data-i18n="tituloEuropa">Europa</h3>
                    <a href="#" data-pais="FR">France</a>
                    <a href="#" data-pais="DE">Deutschland</a>
                    <a href="#" data-pais="IT">Italia</a>
                    <a href="#" data-pais="ES">España</a>
                    <a href="#" data-pais="GB">United Kingdom</a>
                </div>

            </div>
        </div>
    </div>

    <script type="module" src="js/script.js"></script>
</body>
</html>
