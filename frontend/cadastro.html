<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=language"/>
</head>
<body>
    <header>
        
        <span id="btn-language" class="material-symbols-outlined">language</span>

    </header>

    <main>

        <div class="cadastro">

            <h1 data-i18n="tituloCadastro">Cadastro</h1>

            <!-- Formulário de Cadastro -->
            <form action="index.html" id="cadastro-form">
                
                <!-- Entrada de usuário -->
                <label for="username" data-i18n="labelCadastroUsuario">Usuário</label>
                <p class="validacao" id="validacao-user"></p>
                <input type="text" id="username" data-i18n-placeholder="placeholderCadastroUsuario" placeholder="Digite seu usuário">

                <!-- Entrada de email -->
                <label for="email" data-i18n="labelCadastroEmail">Endereço de email</label>
                <p class="validacao" id="validacao-email"></p>
                <input type="email" id="email" data-i18n-placeholder="placeholderCadastroEmail" placeholder="Digite seu email">

                <!-- Entrada de senha -->
                <label for="password" data-i18n="labelCadastroSenha">Senha</label>
                <p class="validacao" id="validacao-password"></p>
                <input type="password" id="current-password" data-i18n-placeholder="placeholderCadastroSenha" placeholder="Digite sua senha">

                <!-- Entrada de confirme a senha -->
                <label for="confirm-password" data-i18n="labelCadastroConfirmeSenha">Confirme sua senha</label>
                <p class="validacao" id="validacao-confirm-password"></p>
                <input type="password" id="confirm-password" data-i18n-placeholder="placeholderCadastroConfirmeSenha" placeholder="Digite a senha novamente">

                <!-- Botão de cadastro -->
                <button id="btn-cadastro" data-i18n="botaoCadastro">Criar conta</button>

            </form>

            <!-- Caso usuário tenha login -->
            <div class="login_form">
                <p data-i18n="perguntaLogin">Já tem cadastro?</p>
                <a href="index.html" data-i18n="opcaoLogin">Faça login.</a>
            </div>
        </div>
    </main>

    <!-- Modal de linguagens -->
    <div id="modal-language" class="modal">

        <div class="modal-content">

            <!-- Botão para fechar modal -->
            <button id="fechar-language" class="fechar-modal">✕</button>

            <h2 data-i18n="tituloMenuLinguagem">Selecione seu país/região</h2>

            <div id="paises">

                <div>
                    <h3 data-i18n="tituloAmericas">Américas</h3>
                    <a href="#" data-pais="US">United States</a>
                    <a href="#" data-pais="CA">Canada - Français</a>
                    <a href="#" data-pais="CA">Canada - English</a>
                    <a href="#" data-pais="BR">Brasil</a>
                    <a href="#" data-pais="MX">México</a>
                </div>

                <div>
                    <h3 data-i18n="tituloAsia">Ásia</h3>
                    <a href="#" data-pais="AU">Australia</a>
                    <a href="#" data-pais="CN">中国-简体中文</a>
                    <a href="#" data-pais="IN">India</a>
                    <a href="#" data-pais="JP">日本</a>
                    <a href="#" data-pais="KR">대한민국</a>
                    <a href="#" data-pais="SG">Singapore</a>
                </div>

                <div>
                    <h3 data-i18n="tituloEuropa">Europa</h3>
                    <a href="#" data-pais="FR">France</a>
                    <a href="#" data-pais="DE">Deutschland</a>
                    <a href="#" data-pais="IT">Italia</a>
                    <a href="#" data-pais="ES">España</a>
                    <a href="#" data-pais="GB">United Kingdom</a>
                </div>

            </div>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
